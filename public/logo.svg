<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Text Path -->
    <path id="textPathTop" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
    <!-- Bottom Text Path -->
    <path id="textPathBottom" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
  </defs>

  <!-- Outer Double Circle Borders -->
  <circle cx="250" cy="250" r="242" fill="#ffffff" stroke="#111827" stroke-width="8" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#111827" stroke-width="2.5" />

  <!-- Top Curved School Name -->
  <text font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="34" font-weight="bold" fill="#111827" letter-spacing="1">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      হরিণ সিংহা আদর্শ উচ্চ বিদ্যালয়
    </textPath>
  </text>

  <!-- Side Stars -->
  <!-- Left Side Stars -->
  <g fill="#111827">
    <!-- Star 1 left -->
    <polygon points="52,276 56,289 69,289 58,297 62,310 52,302 42,310 46,297 35,289 48,289" transform="scale(0.85) translate(10, 30)" />
    <!-- Star 2 left -->
    <polygon points="68,326 72,339 85,339 74,347 78,360 68,352 58,360 62,347 51,339 64,339" transform="scale(0.85) translate(20, 20)" />
    <!-- Right Side Stars -->
    <polygon points="448,276 452,289 465,289 454,297 458,310 448,302 438,310 442,297 431,289 444,289" transform="scale(0.85) translate(40, 30)" />
    <polygon points="432,326 436,339 449,339 438,347 442,360 432,352 422,360 426,347 415,339 428,339" transform="scale(0.85) translate(30, 20)" />
  </g>

  <!-- Bottom Curved Location Text -->
  <text font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="32" font-weight="bold" fill="#111827" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      রহমতপুর, গাইবান্ধা।
    </textPath>
  </text>

  <!-- Center Black Medallion -->
  <circle cx="250" cy="250" r="160" fill="#0f172a" stroke="#0f172a" stroke-width="4" />
  <circle cx="250" cy="250" r="156" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Seven Stars Arch inside center circle -->
  <g fill="#ffffff" transform="translate(0, 0)">
    <polygon points="135,170 138,178 147,178 140,183 142,192 135,187 128,192 130,183 123,178 132,178" />
    <polygon points="168,140 171,148 180,148 173,153 175,162 168,157 161,162 163,153 156,148 165,148" />
    <polygon points="206,122 209,130 218,130 211,135 213,144 206,139 199,144 201,135 194,130 203,130" />
    <polygon points="250,116 253,124 262,124 255,129 257,138 250,133 243,138 245,129 238,124 247,124" />
    <polygon points="294,122 297,130 306,130 299,135 301,144 294,139 287,144 289,135 282,130 291,130" />
    <polygon points="332,140 335,148 344,148 337,153 339,162 332,157 325,162 327,153 320,148 329,148" />
    <polygon points="365,170 368,178 377,178 370,183 372,192 365,187 358,192 360,183 353,178 362,178" />
  </g>

  <!-- Sun Rays Radiating from the Open Book -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <line x1="250" y1="210" x2="250" y2="152" stroke-width="3" />
    <line x1="240" y1="212" x2="232" y2="156" />
    <line x1="260" y1="212" x2="268" y2="156" />
    <line x1="228" y1="215" x2="216" y2="162" />
    <line x1="272" y1="215" x2="284" y2="162" />
    <line x1="216" y1="220" x2="198" y2="172" />
    <line x1="284" y1="220" x2="302" y2="172" />
    <line x1="206" y1="226" x2="184" y2="185" />
    <line x1="294" y1="226" x2="316" y2="185" />
    <line x1="198" y1="234" x2="172" y2="200" />
    <line x1="302" y1="234" x2="328" y2="200" />
    <line x1="192" y1="244" x2="165" y2="215" />
    <line x1="308" y1="244" x2="335" y2="215" />
  </g>

  <!-- Sun Core behind Book -->
  <path d="M 200,225 A 50,50 0 0,1 300,225 Z" fill="#ffffff" />

  <!-- Open Book Graphic -->
  <!-- Left Page -->
  <path d="M 250,225 C 220,210 175,200 150,205 L 150,305 C 180,300 220,310 250,325 Z" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <!-- Right Page -->
  <path d="M 250,225 C 280,210 325,200 350,205 L 350,305 C 320,300 280,310 250,325 Z" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <!-- Book Spine Center Line -->
  <line x1="250" y1="225" x2="250" y2="325" stroke="#111827" stroke-width="4" stroke-linecap="round" />

  <!-- Characters inside Book Pages -->
  <!-- Left Page: Bangla 'অ' and numeral '১' -->
  <text x="186" y="248" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">অ</text>
  <text x="188" y="290" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">১</text>

  <!-- Right Page: Symbol and English 'A' -->
  <text x="302" y="248" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="30" font-weight="bold" fill="#0f172a" text-anchor="middle">১</text>
  <text x="302" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">A</text>

  <!-- Bottom Date Banner inside center circle: স্থাপিত-১৯৭০ইং -->
  <text x="250" y="372" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    স্থাপিত-১৯৭০ইং
  </text>
</svg>
